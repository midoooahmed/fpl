<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0F19">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>مركز الفانتازي</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--r:16px;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);--ng:#FF8A6B}
[data-theme=dark]{color-scheme:dark;--bg:#0B0F19;--s1:#121826;--s2:#182033;--s3:#1B2438;--ln:#232C42;--tx:#EAEEF7;--mu:#98A2B8;--ng:#FF8A6B;--dr:#0E1320;--scrim:rgba(4,6,12,.7);--pitch:#0F2A22;--pl:#1F4A3A;--ok:#13241A;--okl:#26452F;--okt:#86C99A;--sh:none}
[data-theme=light]{color-scheme:light;--bg:#F3F5FA;--s1:#fff;--s2:#EEF1F8;--s3:#E7EBF4;--ln:#E0E5F0;--tx:#101626;--mu:#586175;--ng:#C2410C;--dr:#fff;--scrim:rgba(16,22,38,.45);--pitch:#2F9E62;--pl:rgba(255,255,255,.5);--ok:#E6F6EA;--okl:#B7E1C2;--okt:#1F6B3A;--sh:0 1px 2px rgba(16,22,38,.06),0 6px 18px rgba(16,22,38,.05)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:400 14px/1.5 'Rubik',system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.n{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
.bar{position:sticky;top:0;z-index:20;height:calc(60px + var(--safe-t));padding:var(--safe-t) 10px 0;display:flex;align-items:center;gap:4px;background:var(--bg);border-bottom:1px solid var(--ln)}
.bar h1{margin:0;font-size:17px;font-weight:600;flex:1;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border-radius:12px;border:0;background:none;display:grid;place-items:center;padding:0;flex:none}
.ib.f{background:var(--s1);border:1px solid var(--ln)}
.ib.sm{width:36px;height:36px;border-radius:10px;color:var(--mu)}
.ctx{display:flex;align-items:center;gap:10px;padding:12px 16px 2px;flex-wrap:wrap}
.gw{display:flex;align-items:center;background:var(--s1);border:1px solid var(--ln);border-radius:12px}
.gw button.t{border:0;background:none;padding:0 10px;font-weight:600;font-size:15px;height:36px}
.lv{display:inline-flex;align-items:center;gap:7px;color:var(--act);font-size:12px;font-weight:500}
.lv i{width:7px;height:7px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 22%,transparent)}
.lv.off{color:var(--mu)}.lv.off i{background:var(--mu);box-shadow:none}
main{padding:0 16px calc(24px + var(--safe-b));max-width:980px;margin:0 auto}
.sec{display:flex;justify-content:space-between;align-items:center;margin:18px 0 8px;font-size:13px;font-weight:500;color:var(--mu)}
.cd{background:var(--s1);border:1px solid var(--ln);border-radius:var(--r);padding:16px;position:relative;box-shadow:var(--sh)}
.cd+.cd{margin-top:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g2 .cd+.cd{margin-top:0}
.k{font-size:12px;color:var(--mu)}
.up{color:var(--act)}.dn{color:var(--ng)}.mut{color:var(--mu)}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--s3);color:var(--mu);font-size:12px;font-weight:500;white-space:nowrap}
.chip.ac{background:color-mix(in srgb,var(--ac) 20%,transparent);color:var(--act)}
.chip.w{background:color-mix(in srgb,var(--ng) 18%,transparent);color:var(--ng)}
.btn{height:48px;border-radius:12px;border:0;font-weight:600;font-size:15px;padding:0 18px}
.b1{background:var(--ac);color:#0B0F19}.b2{background:var(--s3)}
.sg{display:flex;gap:4px;padding:4px;background:var(--s1);border:1px solid var(--ln);border-radius:12px;overflow-x:auto}
.sg button{flex:1;border:0;background:none;padding:9px 12px;font-size:13px;font-weight:500;color:var(--mu);border-radius:8px;white-space:nowrap}
.sg button.on{background:var(--tx);color:var(--bg)}
.sw{width:44px;height:26px;border-radius:99px;background:var(--s3);position:relative;flex:none;border:0;padding:0}
.sw:after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:var(--tx);transition:.15s}
.sw.on{background:var(--ac)}.sw.on:after{inset-inline-start:21px;background:#0B0F19}
.tg{display:flex;align-items:center;justify-content:space-between;min-height:46px;font-weight:500;border-bottom:1px solid var(--ln)}
.av{--s:36px;position:relative;width:var(--s);height:var(--s);border-radius:50%;background:var(--s3);display:inline-grid;place-items:center;overflow:hidden;flex:none;font-weight:600;font-size:calc(var(--s)*.34)}
.av img{position:absolute;top:2%;left:-30%;width:160%;max-width:none;opacity:0}.av img.ok{opacity:1}
.rk{width:30px;height:30px;border-radius:9px;background:var(--s3);display:grid;place-items:center;font-size:13px;font-weight:600;flex:none}
.f1 .rk{background:var(--ac);color:#0B0F19}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--ln)}.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}.row b{font-weight:600}.row small{display:block;color:var(--mu);font-size:12px}
.act{cursor:pointer}.act:active{opacity:.7}
.big{font-size:60px;font-weight:700;line-height:1;color:var(--act);letter-spacing:-2px;margin:6px 0 10px}
.t b{display:block;font-size:24px;font-weight:600;margin:2px 0}.t small{font-size:12px;color:var(--mu)}
.bb{height:7px;border-radius:99px;background:var(--s3);overflow:hidden;direction:ltr}.bb i{display:block;height:100%;background:var(--tx);opacity:.8}.bb i.l{background:var(--ac);opacity:1}
.cam{position:absolute;top:8px;inset-inline-end:8px;width:34px;height:34px;border-radius:10px;border:0;background:var(--s3);color:var(--mu);display:grid;place-items:center;padding:0}
.sr{height:46px;border-radius:12px;border:1px solid var(--ln);background:var(--s1);display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--mu);width:100%;font-size:14px}
.sr input{flex:1;border:0;background:none;color:var(--tx);font:inherit;outline:0;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0}
.chips button{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:99px;background:var(--s1);border:1px solid var(--ln);font-size:13px;font-weight:500;white-space:nowrap}
.chips button.on{border-color:var(--ac);color:var(--act)}
.chips em{font-style:normal;background:var(--ac);color:#0B0F19;border-radius:99px;font-size:11px;padding:0 7px;font-weight:600}
.pb{flex:1;height:5px;border-radius:9px;background:var(--s3);overflow:hidden;direction:ltr}.pb i{display:block;height:100%;background:var(--ac)}
.ms{display:flex;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--ln);font-size:12px;color:var(--mu);align-items:center}
.pt{font-size:22px;font-weight:600;text-align:end;line-height:1.1}.pt small{display:block;font-size:11px;font-weight:500}
.pitch{position:relative;border-radius:var(--r);background:var(--pitch);border:1px solid var(--pl);padding:18px 4px;display:flex;flex-direction:column;gap:14px}
.pitch:before{content:"";position:absolute;inset:8px;border:1px solid var(--pl);border-radius:10px;pointer-events:none}
.pr{position:relative;display:flex;justify-content:space-around;flex-wrap:wrap;row-gap:12px}
.p{width:74px;text-align:center;font-size:11.5px;font-weight:500;color:#fff;position:relative;background:none;border:0;padding:0}
.p .av{--s:42px;margin:0 auto 3px;background:#EAEEF7;color:#0B0F19;display:grid}
.p em{font-style:normal;display:block;font-weight:600;font-size:12.5px;color:#B8F34B}
.p .nm{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.p small{display:block;font-size:10px;opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p.dnp .av{filter:grayscale(1);opacity:.6}
.bg{position:absolute;top:-5px;inset-inline-start:2px;min-width:19px;height:19px;border-radius:50%;background:#B8F34B;color:#0B0F19;font-size:10px;font-weight:700;display:grid;place-items:center;border:2px solid var(--pitch)}
.bg.v{background:#fff}.bg.i{background:#4ADE80;inset-inline-start:auto;inset-inline-end:2px}.bg.o{background:#FF8A6B;inset-inline-start:auto;inset-inline-end:2px}
.bn{background:var(--s2);border-radius:14px;padding:10px 4px;margin-top:10px}.bn .p{color:var(--tx)}.bn .p em{color:var(--mu)}.bn .bg{border-color:var(--s2)}
.hs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.hs div{background:var(--s1);border:1px solid var(--ln);border-radius:12px;padding:10px 4px;text-align:center}.hs b{display:block;font-size:17px;font-weight:600}.hs small{font-size:11px;color:var(--mu)}
.hs.dr div{cursor:pointer}.hs.dr div.sel{border-color:var(--ac)}
.pl{background:var(--ok);border:1px solid var(--okl);border-radius:12px;padding-inline:10px}.pl small{color:var(--okt)}
.sd{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-start:6px}.sd-played,.sd-playing{background:#4ADE80}.sd-live0,.sd-pending{background:#F5B83A}.sd-dnp{background:#FF8A6B}
/* القائمة الجانبية */
#scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;opacity:0;pointer-events:none;transition:.2s}
#drawer{position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(316px,86vw);background:var(--dr);border-inline-end:1px solid var(--ln);z-index:50;display:flex;flex-direction:column;transform:translateX(100%);transition:.22s;padding-top:var(--safe-t)}
body.dro #drawer{transform:none}body.dro #scrim{opacity:1;pointer-events:auto}
.dh{display:flex;align-items:center;gap:10px;padding:14px 14px 10px;font-weight:600;font-size:17px}
.mk{width:38px;height:38px;border-radius:11px;background:var(--ac);color:#0B0F19;display:grid;place-items:center}
.ns{flex:1;overflow-y:auto;padding:0 10px}.gp{font-size:12px;color:var(--mu);margin:12px 8px 6px}
.tb{display:flex;align-items:center;gap:12px;min-height:54px;padding:8px 10px;border-radius:12px;font-weight:500;width:100%;border:0;background:none;text-align:start}
.tb i{width:36px;height:36px;border-radius:10px;background:var(--s3);display:grid;place-items:center;font-style:normal;flex:none}
.tb span{flex:1}.tb small{display:block;font-size:12px;color:var(--mu);font-weight:400}
.tb.on{background:var(--s2)}.tb.on i{background:var(--ac);color:#0B0F19}
.sub{margin:2px 28px 6px 0;border-inline-start:2px solid var(--ln);padding-inline-start:8px}
.sub button{display:flex;justify-content:space-between;align-items:center;min-height:42px;padding:0 12px;border-radius:10px;color:var(--mu);font-weight:500;width:100%;border:0;background:none}
.sub button.on{background:color-mix(in srgb,var(--ac) 18%,transparent);color:var(--act)}
.sub em{font-style:normal;font-size:12px;background:var(--s3);color:var(--mu);border-radius:99px;padding:1px 9px}
.tl{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 10px;color:var(--tx);font-weight:500;width:100%;border:0;background:none;text-align:start}
.ft{border-top:1px solid var(--ln);padding:12px 16px calc(12px + var(--safe-b));display:flex;align-items:center;gap:10px}
.dots{display:flex;gap:8px;flex:1}.dots button{width:26px;height:26px;border-radius:50%;border:0;padding:0;box-shadow:0 0 0 2px var(--dr),0 0 0 3.5px var(--ln)}.dots button.on{box-shadow:0 0 0 2px var(--dr),0 0 0 4px var(--tx)}
/* الشيت والمودال */
.sheet{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;transform:translateY(8px);opacity:0;pointer-events:none;transition:.18s}
.sheet.show{transform:none;opacity:1;pointer-events:auto}
.sheet .bar{position:sticky}
.sheet main{padding-top:6px}
#modal{position:fixed;inset:0;z-index:80;background:var(--scrim);display:none;align-items:center;justify-content:center;padding:16px}
#modal.show{display:flex}
.md{width:min(420px,100%);max-height:92vh;overflow:auto;background:var(--dr);border:1px solid var(--ln);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:14px}
.mh{display:flex;align-items:center;justify-content:space-between;font-size:17px;font-weight:600}
.pv{border-radius:14px;background:var(--bg);padding:12px;display:grid;place-items:center;min-height:160px}.pv img{max-width:100%;max-height:46vh;border-radius:10px}
#toasts{position:fixed;bottom:calc(18px + var(--safe-b));left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{padding:11px 16px;border-radius:12px;background:var(--tx);color:var(--bg);font-weight:500;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.empty{padding:40px 16px;text-align:center;color:var(--mu)}
.embed{width:100%;height:calc(100vh - 60px - var(--safe-t));border:0;background:var(--bg)}
.shotw{position:fixed;left:-20000px;top:0;width:520px;padding:18px;background:var(--bg);color:var(--tx)}
.shotw h2{margin:0 0 4px;font-size:18px;font-weight:600}.shotw .ft2{display:flex;justify-content:space-between;margin-top:10px;font-size:11px;color:var(--mu)}
.shotw.story{width:540px;min-height:960px;display:flex;flex-direction:column;justify-content:center}
.aw{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.aw .cd{margin:0;padding:12px}
@media(min-width:1000px){
  #drawer{transform:none;width:280px}#scrim{display:none}
  body>.bar,body>.ctx,body>main{margin-inline-start:280px}.bar #mn{display:none}
  .sheet{inset-inline-start:280px}.sheet .bar,.sheet main{margin-inline-start:0}
}

/* ============ كروت الملخص الجديدة ============ */
.plus-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.mini-t{width:100%;border-collapse:collapse;font-size:13px;text-align:center}
.mini-t th,.mini-t td{padding:7px 6px;border-bottom:1px solid var(--ln);white-space:nowrap}
.mini-t th{color:var(--mu);font-size:12px;font-weight:700}
.mini-t td:first-child,.mini-t th:first-child{text-align:start}
.mini-t tr.click:hover td{background:var(--s2)}
.tbl-sc{overflow:auto;border-radius:14px}
.stk{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--s3);direction:ltr}
.stk i{display:block;height:100%}
.pz0{background:#6366f1}.pz1{background:#10b981}.pz2{background:#f59e0b}.pz3{background:#ef4444}
.lg{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mu);margin-top:8px}
.lg b{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:4px}
.star{border:none;background:none;font-size:18px;line-height:1;color:var(--mu);padding:0 4px;cursor:pointer}
.star.on{color:#F2A20C}
.fxd{display:inline-flex;flex-direction:column;align-items:center;min-width:54px;padding:5px 7px;border-radius:10px;font-size:12px;font-weight:700;margin:2px;color:#14122B}
.fxd small{font-size:10px;font-weight:600;opacity:.8}
.fxd.d1{background:#34d399}.fxd.d2{background:#a7f3d0}.fxd.d3{background:#e5e7eb}.fxd.d4{background:#fbbf24}.fxd.d5{background:#f87171}
.wi{display:inline-flex;align-items:center;gap:8px}
.wi button{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--ln);background:var(--s1);color:var(--tx);font-size:16px;padding:0}
.wi b{min-width:30px;text-align:center}
.wi b.ch{color:var(--ac)}
.sr-h{font-size:12.5px;font-weight:800;color:var(--mu);margin:10px 2px 2px}
.kiosk .filters,.kiosk .active-bar,.kiosk .tabs-wrap,.kiosk .fab,.kiosk .board-actions{display:none!important}
.kiosk body,body.kiosk{font-size:17px}


.li{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid var(--ln)}.li:first-of-type{border-top:0}
.li .grow{flex:1;min-width:0}.li b{font-weight:600}.li small{display:block;color:var(--mu);font-size:12px}.li .v{font-weight:600;font-variant-numeric:tabular-nums}
.ct{font-size:14px;font-weight:600;margin:0 40px 10px 0}.sub-h{font-size:12.5px;font-weight:500;color:var(--mu);margin:10px 2px 2px}
.tile{background:var(--s2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}.tile span{font-size:12px;color:var(--mu)}.tile b{font-size:20px;font-weight:600}.tile small em{font-style:normal}
.cd.plus .cam{inset-inline-end:8px}
.chip.w2{background:color-mix(in srgb,var(--ng) 18%,transparent)}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500;background:var(--s3);color:var(--mu)}.tag.ac,.tag.chip-mg{background:color-mix(in srgb,var(--ac) 20%,transparent);color:var(--act)}.tag.chip-wc{background:color-mix(in srgb,var(--ng) 18%,transparent);color:var(--ng)}
select.sr{appearance:none;color:var(--tx)}
.tw{overflow:auto;border:1px solid var(--ln);border-radius:var(--r);background:var(--s1);max-height:70vh}
table.gt{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:13px}
.gt th{position:sticky;top:0;z-index:2;background:var(--s2);color:var(--mu);font-weight:500;padding:10px 12px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--ln);cursor:pointer;user-select:none}
.gt td{padding:9px 12px;border-bottom:1px solid var(--ln);text-align:center;white-space:nowrap;vertical-align:middle}.gt td.wr{white-space:normal;min-width:180px;max-width:320px;text-align:start}
.gt th:first-child,.gt td:first-child{position:sticky;inset-inline-start:0;z-index:1;background:var(--s1);text-align:start;box-shadow:-1px 0 0 var(--ln)}.gt th:first-child{z-index:3;background:var(--s2)}
.gt tr.tot td{background:var(--s2);font-weight:600}.gt tbody tr:hover td{background:var(--s2)}
.gt .arr{color:var(--act);font-size:10px;margin-inline-start:3px}
.names{display:flex;flex-wrap:wrap;gap:4px}.nm2{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 8px;border-radius:99px;background:var(--s3);font-size:12px}
.kiosk .bar,.kiosk .ctx{display:none}.kiosk main{font-size:17px}
.tbar{display:flex;gap:8px;align-items:center;margin:10px 0}.tbar .sg{flex:1}
.pk{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:46px;padding:0 14px;border:1px solid var(--ln);border-radius:12px;background:var(--s1);width:100%;font-weight:500}
.opt{display:flex;align-items:center;gap:10px;min-height:46px;border-bottom:1px solid var(--ln);cursor:pointer}.opt .cb{width:20px;height:20px;border-radius:6px;border:2px solid var(--ln);display:grid;place-items:center;flex:none}.opt.on .cb{background:var(--ac);border-color:var(--ac);color:#0B0F19}.opt small{color:var(--mu);margin-inline-start:auto;font-size:12px}
</style>
</head>
<body>
<header class="bar"><button class="ib" id="mn" aria-label="القائمة"></button><h1 id="ttl">الملخص</h1><button class="ib" id="sr" aria-label="بحث"></button><button class="ib" id="cp" aria-label="تصوير الصفحة"></button></header>
<div class="ctx" id="ctx"></div>
<main id="view"></main>
<div id="scrim"></div><nav id="drawer" aria-label="التبويبات"></nav>
<div id="sheet" class="sheet"></div><div id="modal"><div class="md" id="md"></div></div><div id="toasts" aria-live="polite"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
(function(){"use strict";
var CFG=window.CFG||{API:"",TABS:[]};
var $=function(s,r){return(r||document).querySelector(s)},$$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};

   tabs.map(function(t){return'<button class="tb '+(S.tab==="x:"+t.id?"on":"")+'" data-tab="x:'+esc(t.id)+'"><i>'+ic("swap")+"</i><span>"+esc(t.name)+"<small>"+esc(t.sub||"")+"</small></span>"+ic("cl",18)+"</button>"}).join("")+
   '<div class="gp">أدوات</div><button class="tl" id="syn">'+ic("sync")+' تحديث الأعضاء من الليغات</button><button class="tl" id="lnk">'+ic("link")+" نسخ رابط بالفلاتر دي</button>"+'<button class="tl" id="aut">'+ic("sync")+" تحديث لايف تلقائي (كل 5 دقايق)</button></div>"+
   '<div class="ft"><div class="dots">'+Object.keys(ACC).map(function(k){return'<button data-acc="'+k+'" class="'+(S.acc===k?"on":"")+'" style="background:'+ACC[k][0]+'" aria-label="'+k+'"></button>'}).join("")+'</div><button class="ib f" id="th" aria-label="الوضع">'+ic(S.theme==="dark"?"sun":"moon")+"</button></div>"}

function load(force){
  if(!CFG.API){render();return Promise.resolve()}
  var gw=S.gw;

    if(!d||d.success===false){toast((d&&d.message)||"تعذّر التحميل");if(d&&d.members){}else return}

  if(t.closest("[data-gwp]")){openGw();return}
  var gb=t.closest("[data-gw]");if(gb){S.gw=Number(gb.getAttribute("data-gw"));S.D=null;S.stack=[];paintSheet();save();render();load(false);return}
  var dk=t.closest("[data-dk]");if(dk){var id=Number(S.stack[S.stack.length-1].kind.split(":")[1]),pn=$("#drp"),was=dk.classList.contains("sel");$$("#drl div").forEach(function(x){x.classList.remove("sel")});if(was){pn.hidden=true;return}dk.classList.add("sel");pn.innerHTML=drillHtml(id,dk.getAttribute("data-dk"));pn.hidden=false;return}
  if(t.closest("#mn")){document.body.classList.add("dro");return}
  if(t.closest("#sr")){if(S.D)openSearch();return}
  if(t.closest("#sb")){pop();return}

  if(t.id==="modal"){$("#modal").classList.remove("show")}
});
